{% extends "accounts/auth_base.html" %}

{% block title %}Reset password{% endblock %}

{% block card %}
<div class="auth-header">
    <h2>Reset your password</h2>
    <p>Enter your account email and we'll send you a link to choose a new password.</p>
</div>

<form method="POST">
    {% csrf_token %}
    {% include "partials/form_fields.html" %}
    <button type="submit" class="btn btn-primary auth-submit">Send reset link</button>
</form>

<div class="auth-footer">
    <a href="{% url 'login' %}">Back to sign in</a>
</div>
{% endblock %}
