{% extends "accounts/auth_base.html" %}

{% block title %}Check your email{% endblock %}

{% block card %}
<div class="auth-header">
    <h2>Check your email</h2>
    <p>
        If an active account uses that address, a reset link is on its way.
        The link expires in one hour.
    </p>
</div>

<div class="auth-footer">
    <a href="{% url 'login' %}">Back to sign in</a>
</div>
{% endblock %}
