{% for error in form.non_field_errors %}
<div class="field-error">
    {{ error }}
</div>
{% endfor %}

{% for field in form %}

<div class="form-group">

    {{ field.label_tag }}

    {{ field }}

    {% if field.help_text %}
    <small class="text-muted">{{ field.help_text }}</small>
    {% endif %}

    {% for error in field.errors %}
    <div class="field-error">
        {{ error }}
    </div>
    {% endfor %}

</div>

{% endfor %}
