{% if page and page.paginator.num_pages > 1 %}
<div class="pagination">
    {% if page.has_previous %}
    <a class="btn btn-secondary btn-small" href="?{% if filter_query %}{{ filter_query }}&amp;{% endif %}page={{ page.previous_page_number }}">← Previous</a>
    {% endif %}
    <span class="text-muted">
        Page {{ page.number }} of {{ page.paginator.num_pages }} · {{ page.paginator.count }} record{{ page.paginator.count|pluralize }}
    </span>
    {% if page.has_next %}
    <a class="btn btn-secondary btn-small" href="?{% if filter_query %}{{ filter_query }}&amp;{% endif %}page={{ page.next_page_number }}">Next →</a>
    {% endif %}
</div>
{% endif %}
